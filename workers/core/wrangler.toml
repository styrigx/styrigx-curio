# styrigx-curio-core：珍格的核心 Worker（收藏的存、读、导入导出、图标缓存）（CI 部署；承接 curio.styrigx.com/api/*）
#
# 全部后端代码都在本目录：src/（入口、路由表、接口）+ migrations/（D1）。
# Pages（styrigx-curio，配置见 web/wrangler.toml）只放静态文件；页面的会话检查在主站鉴权网关。
#
# 安全：
# - 本 Worker 不持任何钥匙。会话交给鉴权网关验（服务绑定 AUTH → SessionVerifier）。
# - workers_dev = false、preview_urls = false：只通过 curio.styrigx.com 的路由访问（它连的是正式 D1 / R2）。

name = "styrigx-curio-core"
main = "src/index.js"
compatibility_date = "2026-10-21"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

# 路由：curio.styrigx.com/api/*。网关另有更精确的 curio.styrigx.com/api/session-check（精确路径优先），
# 页面路径登记在网关（styrigx-space 仓库 workers/auth-gateway/wrangler.toml），这里只管接口。
[[routes]]
pattern = "curio.styrigx.com/api/*"
zone_name = "styrigx.com"

[[d1_databases]]
binding = "DB"
database_name = "styrigx-curio"
database_id = "8f0c8907-c87c-4cf4-b1ee-0cae384d25c2"
migrations_dir = "migrations"

# R2：icons/（网站小图标缓存）、imports/（每次导入的浏览器书签原文，备份，不自动删）
[[r2_buckets]]
binding = "FILES"
bucket_name = "styrigx-curio"

# 验票：主站鉴权网关的 RPC 入口（session）。
[[services]]
binding = "AUTH"
service = "styrigx-auth-gateway"
entrypoint = "SessionVerifier"
