title: '奇趣'
baseURL: 'https://curio.styrigx.com/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
languages:
  zh:
    label: 中文
    weight: 1
  en:
    label: English
    weight: 2
theme: []

# robots.txt 用 web/static/robots.txt（Disallow: /）。设 true 时 Hugo 内置模板会生成只有 User-agent: * 的文件盖掉它（等于全部允许）
enableRobotsTXT: false
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: 'Sloan Gray 的奇趣：在网上偶然遇到、想留下的好东西'
  version: '0.2.0'

disableKinds: ['taxonomy', 'term', 'rss', 'section']
