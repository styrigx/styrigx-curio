title: '奇趣'
baseURL: 'https://curio.styrigx.com/'
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
hasCJKLanguage: true
languages:
  zh:
    label: 中文
    weight: 1
  en:
    label: English
    weight: 2
theme: []

enableRobotsTXT: true
enableEmoji: true

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  description: 'Sloan Gray 的奇趣：在网上偶然遇到、想留下的好东西'
  version: '0.2.0'
  # 留言板（/guestbook/）：博客、日刻、奇趣三个子站共用同一个 Giscus 讨论串（styrigx/styrigx 仓库 Discussions，Announcements 分类，term = guestbook）。
  # 三个站这段一字不差；改了任何一项就不是同一串留言了。
  guestbook:
    giscus:
      repo: 'styrigx/styrigx'
      repoId: 'R_kgDOVDhNiA'
      category: 'Announcements'
      categoryId: 'DIC_kwDOVDhNiM4DJVrs'
      mapping: 'specific'
      term: 'guestbook'
      strict: '0'
      reactionsEnabled: '1'
      emitMetadata: '0'
      inputPosition: 'top'
      lightTheme: 'light'
      darkTheme: 'dark'
      loading: 'lazy'

disableKinds: ['taxonomy', 'term', 'rss', 'section']
